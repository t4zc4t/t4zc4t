<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 200" width="920" height="200" role="img" aria-label="Workflow: question, sources, clean, test, holds up? if no go back to sources, if yes publish">
<title>Workflow</title>
<style>
.t { font-family:'Segoe UI', Inter, 'Helvetica Neue', Arial, sans-serif; font-size:15px; font-weight:600; fill:#f0f0f0; }
.s { font-size:13px; }
.l { font-family:'Segoe UI', Inter, Arial, sans-serif; font-size:12px; fill:#9a9a9a; letter-spacing:.5px; }
.f { stroke:#FF8000; stroke-width:2; stroke-dasharray:6 5; animation:flow 1.2s linear infinite; }
.b { stroke:#47C7FC; }
@keyframes flow { to { stroke-dashoffset:-22; } }
.n { animation:pop .5s cubic-bezier(.2,.8,.2,1) both; }
@keyframes pop { from { opacity:0; transform:translateY(6px); } }
</style>
<rect width="920" height="200" rx="10" fill="#1a1a1a"/>
<line x1="150" y1="95" x2="182" y2="95" class="f"/><path d="M181,90 L189,95 L181,100" fill="#FF8000"/><line x1="300" y1="95" x2="332" y2="95" class="f"/><path d="M331,90 L339,95 L331,100" fill="#FF8000"/><line x1="440" y1="95" x2="472" y2="95" class="f"/><path d="M471,90 L479,95 L471,100" fill="#FF8000"/><line x1="580" y1="95" x2="632" y2="95" class="f"/><path d="M631,90 L639,95 L631,100" fill="#FF8000"/><line x1="736" y1="95" x2="772" y2="95" class="f"/><path d="M771,90 L779,95 L771,100" fill="#FF8000"/><path d="M688.0,139 V177 H245 V126" class="f b" fill="none"/><path d="M240,127 L245,119 L250,127" fill="#47C7FC"/><g class="n" style="animation-delay:0.00s"><rect x="30" y="72" width="120" height="46" rx="23" fill="#232323" stroke="#FF8000" stroke-width="2"/><text x="90.0" y="100" text-anchor="middle" class="t">Question</text></g><g class="n" style="animation-delay:0.15s"><rect x="190" y="72" width="110" height="46" rx="6" fill="#232323" stroke="#FF8000" stroke-width="2"/><text x="245.0" y="100" text-anchor="middle" class="t">Sources</text></g><g class="n" style="animation-delay:0.30s"><rect x="340" y="72" width="100" height="46" rx="6" fill="#232323" stroke="#FF8000" stroke-width="2"/><text x="390.0" y="100" text-anchor="middle" class="t">Clean</text></g><g class="n" style="animation-delay:0.45s"><rect x="480" y="72" width="100" height="46" rx="6" fill="#232323" stroke="#FF8000" stroke-width="2"/><text x="530.0" y="100" text-anchor="middle" class="t">Test</text></g><g class="n" style="animation-delay:0.60s"><polygon points="688.0,51 736,95 688.0,139 640,95" fill="#232323" stroke="#47C7FC" stroke-width="2"/><text x="688.0" y="100" text-anchor="middle" class="t s">Holds up?</text></g><g class="n" style="animation-delay:0.75s"><rect x="780" y="72" width="112" height="46" rx="23" fill="#232323" stroke="#FF8000" stroke-width="2"/><text x="836.0" y="100" text-anchor="middle" class="t">Publish</text></g><text x="466.5" y="171" text-anchor="middle" class="l">no, go back to the data</text><text x="758" y="85" text-anchor="middle" class="l">yes</text>
</svg>
