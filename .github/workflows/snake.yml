name: snake

on:
  schedule:
    - cron: "30 18 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: [.github/workflows/snake.yml]

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake-light.svg?palette=github-light&color_snake=#FF8000&color_dots=#ebedf0,#ffd9b3,#ffb366,#ff9933,#FF8000
            dist/snake-dark.svg?palette=github-dark&color_snake=#FF8000&color_dots=#1f1f1f,#5c3200,#994d00,#cc6600,#FF8000

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
