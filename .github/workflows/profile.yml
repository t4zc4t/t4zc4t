name: profile

on:
  schedule:
    - cron: "30 18 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: [.github/workflows/profile.yml, .github/stats_card.py]

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake-light.svg?palette=github-light&color_snake=#a51c2a&color_dots=#efe6d6,#e0cba6,#c8a97e,#a8824d,#7a5a2e
            dist/snake-dark.svg?palette=github-dark&color_snake=#e8dfcf&color_dots=#161111,#4a0f15,#7a141e,#a81b28,#d7263d

      - name: Activity card
        run: python3 .github/stats_card.py dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PROFILE_USER: ${{ github.repository_owner }}

      - uses: crazy-max/ghaction-github-pages@v5
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
